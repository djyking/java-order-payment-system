global: { scrape_interval: 15s }
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: order-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080", "host.docker.internal:8081", "host.docker.internal:8082", "host.docker.internal:8083", "host.docker.internal:8084", "host.docker.internal:8085", "host.docker.internal:8086"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
