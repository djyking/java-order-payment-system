global: { scrape_interval: 15s }
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: order-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-gateway:8080", "order-user-service:8081", "order-product-service:8082", "order-inventory-service:8083", "order-order-service:8084", "order-payment-service:8085", "order-query-service:8086"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
