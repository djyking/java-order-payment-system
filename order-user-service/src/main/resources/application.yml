server: { port: 8081 }
spring:
  application: { name: order-user-service }
  config.import:
    - "optional:nacos:order-system-shared.yml?group=DEFAULT_GROUP&refreshEnabled=true"
    - "optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud.nacos:
    discovery: { server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:18848}" }
    config: { server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:18848}", file-extension: yml }
management.endpoints.web.exposure.include: health,info,prometheus
management.metrics.tags.application: ${spring.application.name}
security.jwt.secret: ${JWT_SECRET:change-this-enterprise-order-system-secret-at-least-32-bytes}
