server: { port: 8085 }
spring:
  application: { name: order-payment-service }
  config.import:
    - "optional:nacos:order-system-shared.yml?group=DEFAULT_GROUP&refreshEnabled=true"
    - "optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud.nacos:
    discovery: { server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:18848}" }
    config: { server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:18848}", file-extension: yml }
  datasource: { url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/order_payment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai", username: "${MYSQL_USER:order}", password: "${MYSQL_PASSWORD:order123456}" }
  rabbitmq: { host: "${RABBITMQ_HOST:localhost}", port: "${RABBITMQ_PORT:25672}", username: "${RABBITMQ_USER:order}", password: "${RABBITMQ_PASSWORD:order123456}", publisher-confirm-type: correlated, publisher-returns: true }
management.endpoints.web.exposure.include: health,info,prometheus
management.metrics.tags.application: ${spring.application.name}
debug.failure.create-error: "${DEBUG_PAYMENT_CREATE_ERROR:false}"
